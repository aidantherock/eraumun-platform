[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.processing]
  skip_processing = true

[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_PATHS = "netlify/functions/setup-admin.js"

[[plugins]]
  package = "@netlify/plugin-emails"

[functions."scheduled-flows"]
  schedule = "@hourly"